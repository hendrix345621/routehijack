extends: base.yaml

# Shared defaults for hybrid-reasoning models. Evaluation always segments the
# generated trace and scores the complete answer after </think>.
model:
  enable_thinking: true
identify:
  span: answer
attacks:
  routeaudit:
    lambda_promote: 0.0
    target_mode: thought
    target_len: 32
    ascii_only: true
eval:
  max_new_tokens: 2048
  generation:
    do_sample: true
    temperature: 0.6
    top_p: 0.95
    top_k: 20
  mmlu:
    generative: true

# RouteAudit config — DeepSeek-V2-Lite-Chat. The cheap DeepSeekMoE sibling.
# Routing-analysis target for the universal evaluator.
#
# Why this config exists: it is the only real model that exercises the GROUPED
# (node-limited) gate path, and it fits in ~9 GB under NF4. Use it to check that the
# routing capture works against a genuine non-softmax gate.
#
# This checkpoint has a sigmoid, node-limited top-k gate and a standard residual stream.

model:
  hf_id: deepseek-ai/DeepSeek-V2-Lite-Chat
  dtype: bfloat16
  device_map: auto
  n_layers: 27
  n_experts: 64             # routed; 2 shared experts are always-on and not hooked
  top_k: 6
  d_model: 2048
  use_chat_template: true
  arch:
    name: deepseek
    router_output: recompute

  routing:
    scoring_func: sigmoid
    use_bias: false                 # V2-Lite predates the aux-loss-free balancing bias
    n_group: 1                      # V2-Lite: 1 group (V2-236B/V3 use 8)
    topk_group: 1
    norm_topk_prob: false
    routed_scaling_factor: 1.0
    num_hash_layers: 0
    first_k_dense_replace: 1        # layer 0 is a dense MLP (no gate)

identify:
  pairs_path: ./data/llm_lat_pairs.jsonl
  general_corpus_path: ./data/c4_general.jsonl
  n_pairs: 600
  n_general: 5000
  top_pct: 0.20
  response_only: true

attacks:
  routeaudit:
    suffix_len: 20
    n_steps: 300
    lambda_suppress: 3.0
    lambda_promote: 1.0
    lambda_refusal: 1.0
    promote_threshold: 0.3
    refusal_window: 1

eval:
  asr:
    judge_hf_id: cais/HarmBench-Llama-2-13b-cls
    n_prompts: 100
  mmlu:
    n_questions: 500

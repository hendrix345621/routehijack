# Shared defaults and the supported low-cost end-to-end target.
model:
  hf_id: allenai/OLMoE-1B-7B-0924-Instruct
  dtype: bfloat16
  device_map: auto
  n_layers: 16
  n_experts: 64
  top_k: 8
  d_model: 2048
  use_chat_template: true
  arch:
    name: olmoe

data:
  n_pairs: 600
  n_general: 5000
  n_mmlu: 500

identify:
  pairs_path: ./data/llm_lat_pairs.jsonl
  general_corpus_path: ./data/c4_general.jsonl
  top_pct: 0.20
  span: all
  max_think_tokens: 256

attacks:
  routeaudit:
    suffix_len: 20
    n_steps: 300
    lambda_suppress: 3.0
    lambda_promote: 1.0
    lambda_refusal: 1.0
    lambda_target: 1.0
    target_len: 16
    target_mode: answer
    promote_threshold: 0.3
    refusal_window: 1
    ascii_only: false

eval:
  max_new_tokens: 128
  asr:
    judge_hf_id: meta-llama/Llama-Guard-3-1B
    judge_kind: llamaguard
    n_prompts: 100
  mmlu:
    generative: false

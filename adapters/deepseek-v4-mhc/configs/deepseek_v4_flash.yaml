# RouteAudit config — DeepSeek-V4-Flash (DeepSeekMoE + mHC).
#
# Every value below is transcribed from the released `deepseek-ai/DeepSeek-V4-Flash`
# config.json and from transformers' `models/deepseek_v4/modeling_deepseek_v4.py`
# (DeepseekV4TopKRouter, DeepseekV4HashRouter, DeepseekV4HyperConnection). Verified
# 2026-08-02. `deepseek_v4` is natively supported — transformers_version 4.57.1, no
# auto_map, so no trust_remote_code module is involved.
#
# Module layout (DeepseekV4DecoderLayer):
#   self_attn · mlp (DeepseekV4SparseMoeBlock) · input_layernorm ·
#   post_attention_layernorm · attn_hc · ffn_hc  (both DeepseekV4HyperConnection)
#   mlp.gate      → DeepseekV4TopKRouter, or DeepseekV4HashRouter on hash layers
#   mlp.experts   → DeepseekV4Experts — FUSED nn.Parameters, not an nn.ModuleList
#   mlp.shared_experts → always-on, deliberately NOT hooked
#
# ──────────────────────────────────────────────────────────────────────────────
# WHAT WORKS ON THIS MODEL
#   ✓ 00 data       — model-independent
#   ✓ 01 harvest    — expert localization. Selection is recomputed through the real
#                     gate (`gate_math`), NOT `topk(logits)`: this gate emits no logit
#                     tensor and its balancing bias shifts which experts win.
#   ✓ eval MMLU/ASR — generation-only, architecture-independent
#   ✓ routing shift — via experiments/mhc/route_mhc.py (TESR/THPR on real gating weights)
#   ✗ 02 routeaudit — THE SUFFIX ATTACK DOES NOT RUN. Its losses are `softmax(router_logits)`
#                     over a tensor this gate never produces. Porting it (bias-free gating
#                     weights + a selection-margin hinge) is phase P2 in
#                     experiments/mhc/plan.md, gated on the P1 feasibility verdict.
#                     `make all` on this config will fail at the attack stage — run
#                     `make harvest` and the diagnostics instead.
#
# THE GATE — DeepseekV4TopKRouter.forward, verbatim behavior:
#   logits  = F.linear(h, W)                       # W: (256, 4096)
#   scores  = sqrt(softplus(logits))               # scoring_func; NOT sigmoid/softmax
#   indices = topk(scores + e_score_correction_bias, k=6, sorted=False).indices
#   weights = scores.gather(indices) / (sum + 1e-20) * 1.5      # BIAS-FREE scores
#   return (logits, weights, indices)
#
#   Two things follow that the pre-verification docs got wrong:
#   • The gate DOES return its logits, as element 0 of the tuple. Routing is read from
#     the gate's OUTPUT, not recomputed from its weight matrix — which matters because
#     the weight matrix is fp8 and `F.linear` against it would not reproduce the model.
#   • There is no grouped / node-limited selection: no n_group, no topk_group in the
#     config or the router. That was a V2/V3 mechanism. Selection is a flat top-6 over
#     all 256 experts, so the margin is cleanly 1-D. `topk_method: noaux_tc` names the
#     auxiliary-loss-free balancing bias (Wang et al. 2024a).
#
# HASH ROUTING (DeepseekV4HashRouter): the first `num_hash_layers` MoE layers take
#   indices = tid2eid[input_ids]           # static token-id table, non-differentiable
#   weights = scores.gather(indices) / sum * 1.5    # ← still the LEARNED scores
#   so the SELECTION is content-independent but the gating WEIGHTS are not. They are
#   excluded from expert localization because Eq. 3 counts top-k membership, which on
#   these layers is a fixed function of token id and carries no safety signal (and
#   because 3 x 256 all-zero cells would otherwise outrank real experts at selection
#   time). Their content-dependent weight magnitude is NOT currently captured — see the
#   technical-challenges doc.
#
# mHC (DeepseekV4HyperConnection, one per sub-layer: attn_hc, ffn_hc). Hidden states are
# (B, S, hc_mult, D) THROUGHOUT the layer stack, not just inside the module. The residual
# update is
#     post.unsqueeze(-1) * out.unsqueeze(-2) + matmul(comb.transpose(-1,-2), streams)
# so B = combᵀ. The Sinkhorn projection is `softmax(dim=-1)` then 20 alternating steps
# ENDING on a column normalization — so comb's columns are exact and B's are only
# approximate, which means the stream mean is conserved to the finite-iteration residual
# rather than exactly. Measure it (`mhc.b_path_conservation_check`); don't assume it.
# The gate is unaffected: `collapsed` is a normal (B, S, D) tensor. Reduce captured
# residuals with `mhc.reduce_residual`, never `.view(T, -1)`.
#
# PRECISION: config declares torch_dtype bfloat16 with a quantization_config of
# fp8 e4m3 (128x128 weight blocks, dynamic activation scaling, ue8m0 scale format), and
# expert_dtype fp4. Both are quantization-aware-trained — that IS the deployed model, not
# an approximation of a bf16 one. Load as-shipped and let Transformers handle the packed
# weights. Do NOT add bitsandbytes NF4/int8; `model/precision.py` refuses it (it keys off
# expert_dtype). The current native FP4 expert backend requires Blackwell (SM100+) and
# CUDA toolkit 12.9+. The pinned checkpoint is 159.63 GB; budget at least 20 GiB of VRAM
# beyond its file size for runtime state. H100/H200 are NOT the no-surprises native path.
#
# CONFIRMED ABSENT from the released config, so not set below:
#   • n_group / topk_group        — selection is flat
#   • first_k_dense_replace       — 43-layer all-MoE backbone, no dense MLP layers
#   • auto_map                    — natively supported, no trust_remote_code module
#
# STILL UNVERIFIED: the bit-for-bit gate fixture check (experiments/mhc/fixtures/) has
# not run — it needs the weights. Until it passes, this config is source-faithful but not
# execution-verified. See experiments/mhc/technical_challenges.md.
# ──────────────────────────────────────────────────────────────────────────────

model:
  hf_id: deepseek-ai/DeepSeek-V4-Flash
  revision: 60d8d70770c6776ff598c94bb586a859a38244f1
  dtype: bfloat16           # config's torch_dtype; the fp8 quantization_config drives
                            # the actual storage (e4m3, 128x128 blocks, dynamic scales)
  expert_dtype: fp4         # MoE experts; read by model/precision.py to refuse re-quant
  device_map: auto          # ~160 GB — 2x80 GB loads natively; else expert CPU-offload
  n_layers: 43
  n_experts: 256            # n_routed_experts; the 1 shared expert is not hooked
  top_k: 6
  d_model: 4096
  d_expert: 2048            # moe_intermediate_size
  vocab_size: 129280
  use_chat_template: true
  load:
    experts_implementation: deepgemm  # native packed-FP4 path; Blackwell SM100+ only
    attn_implementation: null         # V4 is eager-only; SDPA cannot represent its sink term
  arch:
    name: deepseek
    router_output: recompute        # re-derive selection; logits come from output[0]

  # ── gate semantics (read by gate_math.GateSpec.from_config) ──
  routing:
    scoring_func: sqrtsoftplus      # config scoring_func
    use_bias: true                  # e_score_correction_bias (topk_method: noaux_tc)
    n_group: 1                      # FLAT top-k — absent from the released config
    topk_group: 0
    norm_topk_prob: true
    routed_scaling_factor: 1.5
    num_hash_layers: 3              # leading MoE layers routed by token id
    first_k_dense_replace: 0        # confirmed: all-MoE backbone, no dense layers

  # ── mHC residual stream (affects residual hooks, not the gate) ──
  mhc:
    hc_mult: 4                      # parallel residual streams, (B,S,4,D) throughout
    hc_sinkhorn_iters: 20           # softmax init, alternating, ends on column norm
    hc_eps: 1.0e-06                 # added to every Sinkhorn denominator

  # ── attention (informational; CSA/HCA attribution is deliberately not implemented) ──
  attention:
    variant: MLA + CSA/HCA
    sliding_window: 128
    head_dim: 512
    num_attention_heads: 64
    num_key_value_heads: 1
    q_lora_rank: 1024
    o_lora_rank: 1024
    o_groups: 8
    qk_rope_head_dim: 64
    index_n_heads: 64               # Lightning Indexer
    index_head_dim: 128
    index_topk: 512
    rope_theta: 10000
    compress_rope_theta: 160000
    max_position_embeddings: 1048576
    note: "per-layer compress_ratios: 0 = dense/SWA (layers 0-1 and the last),
           4 = CSA, 128 = HCA, alternating in between."

  # ── other verified constants (informational) ──
  swiglu_limit: 10.0                # expert activation clamp
  n_shared_experts: 1
  num_nextn_predict_layers: 1       # MTP depth

  # Forward-only phases (harvest, eval) fit a smaller box by spilling MoE experts to
  # CPU while the router and attention stay resident. Uncomment and size to your node.
  # load:
  #   max_memory: {0: "78GiB", 1: "78GiB", cpu: "400GiB"}
  #   offload_folder: ./offload

identify:
  pairs_path: ./data/llm_lat_pairs.jsonl
  general_corpus_path: ./data/c4_general.jsonl
  n_pairs: 600
  n_general: 5000
  top_pct: 0.20
  response_only: true

attacks:
  routeaudit:
    # ⚠ NOT USED — the suffix search does not support this gate (see the header).
    # Kept so the config validates and so the eventual P2 port has its defaults.
    suffix_len: 20
    n_steps: 300
    lambda_suppress: 3.0
    lambda_promote: 1.0
    lambda_refusal: 1.0
    promote_threshold: 0.3
    refusal_window: 1

eval:
  asr:
    judge_hf_id: cais/HarmBench-Llama-2-13b-cls
    n_prompts: 100
  mmlu:
    n_questions: 500

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routeaudit-deepseek-v4"
version = "0.1.0"
description = "Standalone routing-safety evaluation and mHC diagnostics for DeepSeek V4"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.9",
  "accelerate>=0.33",
  "datasets>=2.20",
  "huggingface_hub>=0.24",
  "numpy>=1.26",
  "pyyaml>=6",
  "rich>=13",
  "tqdm>=4.66",
  "transformers>=5.14,<5.15",
  "kernels>=0.15,<0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["routeaudit*", "routeaudit_deepseek_v4*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
